:root{--bg:#0a0e13;--p:#111922;--l:#1b2531;--t:#eef2f6;--m:#7d8c9b;--a:#2b95e0;--o:#24527a;--br:16px;--sr:50%;--sb:var(--l)}
[data-th=light]{--bg:#fff;--p:#fff;--l:#eef1f4;--t:#101418;--m:#6c7781;--o:#d7efff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;overflow:hidden}
#app{position:fixed;left:0;right:0;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--l);min-height:56px}.bar b{flex:1;min-width:0;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bar small{display:block;color:var(--m);font-weight:400;font-size:13px}
button{background:var(--a);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600}button.g{background:var(--l);color:var(--t)}button.r{background:#d33}button.ic{background:none;color:var(--m);padding:6px;display:grid;place-items:center;border-radius:50%}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,textarea{background:var(--l);color:var(--t);border:0;border-radius:12px;padding:12px;font:inherit;width:100%;outline:0}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.it{display:flex;gap:12px;padding:9px 14px;align-items:center}.it>div{min-width:0}.it small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tm{margin-left:auto}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#5bc0f8,#2b6cb0);display:grid;place-items:center;flex:none;font-weight:700;color:#fff;object-fit:cover;overflow:hidden}.av svg{width:55%;height:55%}
.vf{width:16px;height:16px;vertical-align:-3px;margin-left:4px}.bd{font-size:11px;border-radius:6px;padding:1px 5px;margin-left:4px;color:#fff;font-weight:600}.s{background:#d22}.mo{background:#6a4}
#msgs{display:flex;flex-direction:column;padding:8px 0;background:var(--bg)}.m{max-width:80%;margin:2px 10px;padding:7px 11px;border-radius:var(--br);background:var(--l);align-self:flex-start;word-break:break-word}.m.me{background:var(--o);align-self:flex-end}
.m.sk{background:none;padding:0}.m small{display:block;color:var(--a);font-size:13px;font-weight:600}.tm{font-size:11px;color:var(--m);text-align:right;margin-top:2px}.mt{color:var(--m);font-size:14px}
.q{border-left:3px solid var(--a);padding:2px 8px;margin-bottom:4px;color:var(--m);font-size:13px}.rx{display:inline-block;background:#0004;border-radius:10px;padding:1px 8px;margin:3px 3px 0 0;font-size:13px}
.cv{width:190px;height:190px;border-radius:50%;object-fit:cover;display:block}audio{width:230px;height:38px}.vc audio{width:150px}
.stk{width:140px;height:140px;border-radius:var(--sr);background:var(--sb);overflow:hidden;color:var(--t)}.stk svg{width:100%;height:100%}
.in{display:flex;gap:4px;padding:6px 8px;background:var(--p);align-items:center;padding-bottom:max(6px,env(safe-area-inset-bottom))}.in input{flex:1;border-radius:22px;padding:11px 14px}
.in .go{background:var(--a);color:#fff;width:42px;height:42px;padding:0;border-radius:50%}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}.pad.c{text-align:center;justify-content:center;min-height:100%;align-items:stretch}.row{display:flex;gap:8px;margin-top:6px}
.tabs{display:flex;background:var(--p);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}.tabs div{flex:1;text-align:center;padding:7px 0;font-size:11px;color:var(--m)}.tabs div.on{color:var(--a)}.tabs svg{display:block;margin:0 auto 2px}
#pn,#rb{padding:7px 14px;background:var(--p);border-bottom:1px solid var(--l);font-size:14px;display:none;color:var(--m)}
#mod{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end}#mod>div{background:var(--p);width:100%;max-height:88%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;border-radius:18px 18px 0 0}
#rec{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.logo{width:96px;height:96px;border-radius:50%;margin:0 auto}.h{font-size:28px;font-weight:800}.h2{font-size:20px;font-weight:700}.err{color:#f66;min-height:20px}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--l)}.dots i.on{background:var(--a)}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .stk{width:100%;height:auto;aspect-ratio:1}

  else if(a=='edit'){const v=prompt(t('edt'),m.text);if(v)await api('edit',{mid:m.id,text:v})}else if(a=='pin')await api('pin',{mid:m.id,on:cur.pinId!=m.id});
  else if(a=='delme'){await api('del',{mid:m.id,all:false});const d=document.querySelector(`[data-id="${m.id}"]`);d&&d.remove()}else if(a=='delall')await api('del',{mid:m.id,all:true});
  else if(a=='rep'){await api('report',{uid:m.uid,reason:prompt(t('reason'))||''});alert(t('reported'))}}catch(x){alert(x.error)}})}
function rec(c,video){const R=$('#rec'),pv=$('#pv');let st,rc,ch=[],tm,s=0;const ty=video?'video/webm':'audio/webm';
 navigator.mediaDevices.getUserMedia(video?{video:{facingMode:'user',width:360,height:360},audio:true}:{audio:true}).then(m=>{st=m;pv.style.display=video?'block':'none';if(video){pv.srcObject=m;pv.play()}R.style.display='flex';
  rc=new MediaRecorder(m,MediaRecorder.isTypeSupported(ty)?{mimeType:ty}:{});rc.ondataavailable=e=>ch.push(e.data);
  const fin=send=>{clearInterval(tm);R.style.display='none';st.getTracks().forEach(x=>x.stop());rc.onstop=()=>{if(!send)return;const f=new FileReader();f.onload=()=>api('send',{cid:c.id,kind:video?'circle':'voice',data:f.result}).catch(x=>alert(x.error));f.readAsDataURL(new Blob(ch,{type:ty}))};rc.state!='inactive'&&rc.stop()};
  $('#rs').textContent=t('send');$('#rc').textContent=t('cancel');$('#rs').onclick=()=>fin(true);$('#rc').onclick=()=>fin(false);
  rc.start();tm=setInterval(()=>{$('#rt').textContent=(++s)+' s';if(s>=(video?30:120))fin(true)},1000)}).catch(()=>alert('Camera / Mic denied'))}
function fbDlg(){dlg(`<b>${t('fbq')}</b><textarea id="ft" rows="4" placeholder="${t('fbp')}"></textarea><button id="fs">${t('send')}</button>`,el=>el.querySelector('#fs').onclick=async()=>{const v=$('#ft').value.trim();if(v)await api('feedback',{text:v});shut()})}
async function fbs(){const r=await api('feedbacks');dlg(`<b>${t('fb')}</b>`+(r.list.map(f=>`<div class="m" style="max-width:100%"><small>${esc(f.user?.name)} @${esc(f.user?.username)}</small>${esc(f.text)}</div>`).join('')||t('none')))}
async function users(){const r=await api('users');dlg(`<b>${t('users')}</b><div class="mt">${t('reload')}: ${t('rl')}</div>`+r.users.map(u=>`<div class="m" style="max-width:100%"><small>${esc(u.name)}${bad(u)} @${esc(u.username)} ${u.ban?'[ban]':''}${u.mute?'[mute]':''}</small>${u.role!='owner'?`<div class="row"><button class="g" data-r="${u.id}">${t('reload')}</button><button class="r" data-w="${u.id}">${t('wipe')}</button></div>`:'OWNER'}</div>`).join(''),
 el=>el.onclick=async e=>{const r=e.target.dataset.r,w=e.target.dataset.w;try{if(r){await api('reload',{uid:r});alert('OK');users()}else if(w&&confirm(t('sure'))){await api('wipe',{uid:w});users()}}catch(x){alert(x.error)}})}
function acts(o,isU){const st=me.role!='user',ow=me.role=='owner';return`${st?`<button class="g" data-a="scam">${o.scam?t('unscam'):t('scam')}</button>`:''}${ow?`<button class="g" data-a="ver">${o.verified?t('unverify'):t('verify')}</button>`:''}${ow&&isU&&o.role!='owner'?`<button class="g" data-a="mod">${o.role=='mod'?t('unmod'):t('mod')}</button>`:''}
 ${st&&isU&&o.role!='owner'?`<b>${t('rules')}</b>${rules.map(r=>`<button class="r" data-r="${r[0]}">${r[0]} ${esc(r[1].split(' / ')[L=='ru'?0:1])}: ${r[2]} ${r[3]>=1e9?'inf':r[3]>=1440?r[3]/1440+'d':r[3]>=60?r[3]/60+'h':r[3]+'m'}</button>`).join('')}<button class="g" data-r="unban">${t('unban')}</button>`:''}`}
function wire(o,isU){return el=>el.onclick=async e=>{const a=e.target.dataset.a,r=e.target.dataset.r;if(!a&&!r)return;try{
  if(r)await api('mod',{uid:o.id,rule:r});else if(a=='write'){shut();return openChat((await api('dm',{uid:o.id})).chat)}
  else if(a=='report'){await api('report',{uid:o.id,reason:prompt(t('reason'))||''});alert(t('reported'))}
  else if(a=='scam')await api('scam',{kind:isU?'user':'chat',id:o.id,on:!o.scam,reason:o.scam?'':prompt(t('reason'))||'-'});
  else if(a=='ver')await api('verify',{kind:isU?'user':'chat',id:o.id,on:!o.verified});else if(a=='mod')await api('setmod',{username:o.username,on:o.role!='mod'});else return;
  shut();home()}catch(x){alert(x.error)}}}
async function prof(o,c){try{o=(await api('user',{uid:o.id})).user}catch{}
 dlg(`<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px">${av(o.name,o,96)}<div class="h2">${esc(o.name)}${bad(o)}</div><div class="mt">${stat(o)}</div><div>@${esc(o.username)}</div><div>${esc(o.bio)}</div><div class="mt">${t('since')} ${o.since?new Date(o.since).toLocaleDateString():''}</div></div>${o.id!=me.id?`${c?'':`<button data-a="write">${t('write')}</button>`}<button class="g" data-a="report">${t('rep')}</button>`:''}`+acts(o,true),wire(o,true))}
function cinfo(c){if(c.type=='saved'||c.type=='system')return;dlg(`<div style="text-align:center"><div class="h2">${esc(c.title)}${bad(c)}</div><div class="mt">${c.slug?'@'+esc(c.slug):''}</div></div>`+acts(c,false),wire(c,false))}
async function appeals(){const r=await api('appeals');dlg(`<b>${t('ap')}</b>`+(r.appeals.map(a=>`<div class="m" style="max-width:100%"><small>${esc(a.user?.name)} @${esc(a.user?.username)} (${esc(a.reason||'')})</small>${esc(a.text)}<div class="row"><button data-u="${a.uid}">${t('unban')}</button></div></div>`).join('')||t('none')),
 el=>el.onclick=async e=>{if(e.target.dataset.u){await api('mod',{uid:e.target.dataset.u,rule:'unban'});shut()}})}
fit();boot();
</script></body></html>
