[data-th=light]{--bg:#fff;--p:#fff;--l:#eef1f4;--t:#101418;--m:#6c7781;--o:#d7efff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;overflow:hidden}

input,textarea{background:var(--l);color:var(--t);border:0;border-radius:12px;padding:12px;font:inherit;width:100%;outline:0}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.it{display:flex;gap:12px;padding:9px 14px;align-items:center}.it>div{min-width:0}.it small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tm{margin-left:auto}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#5bc0f8,#2b6cb0);display:grid;place-items:center;flex:none;font-weight:700;color:#fff;object-fit:cover;overflow:hidden}.av svg{width:55%;height:55%}
.vf{width:16px;height:16px;vertical-align:-3px;margin-left:4px}.bd{font-size:11px;border-radius:6px;padding:1px 5px;margin-left:4px;color:#fff;font-weight:600}.s{background:#d22}.mo{background:#6a4}
#msgs{display:flex;flex-direction:column;padding:8px 0;background:var(--bg)}.m{max-width:80%;margin:2px 10px;padding:7px 11px;border-radius:var(--br);background:var(--l);align-self:flex-start;word-break:break-word}.m.me{background:linear-gradient(135deg,var(--o2,var(--o)),var(--o));align-self:flex-end}
.m.sk{background:none;padding:0}.m small{display:block;color:var(--a);font-size:13px;font-weight:600}.tm{font-size:11px;color:var(--m);text-align:right;margin-top:2px}.mt{color:var(--m);font-size:14px}
.q{border-left:3px solid var(--a);padding:2px 8px;margin-bottom:4px;color:var(--m);font-size:13px}.rx{display:inline-block;background:#0004;border-radius:10px;padding:1px 8px;margin:3px 3px 0 0;font-size:13px}
.cv{width:190px;height:190px;border-radius:50%;object-fit:cover;display:block}audio{width:230px;height:38px}.vc audio{width:150px}

.in{display:flex;gap:4px;padding:6px 8px;background:var(--p);align-items:center;padding-bottom:max(6px,env(safe-area-inset-bottom))}.in input{flex:1;border-radius:22px;padding:11px 14px}
.in .go{background:var(--a);color:var(--ab,#fff);width:42px;height:42px;padding:0;border-radius:50%}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}.pad.c{text-align:center;justify-content:center;min-height:100%;align-items:stretch}.row{display:flex;gap:8px;margin-top:6px}

#pn,#rb{padding:7px 14px;background:var(--p);border-bottom:1px solid var(--l);font-size:14px;display:none;color:var(--m)}
#mod{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end}#mod>div{background:var(--p);width:100%;max-height:88%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;border-radius:18px 18px 0 0}

.logo{width:96px;height:96px;border-radius:50%;margin:0 auto}.h{font-size:28px;font-weight:800}.h2{font-size:20px;font-weight:700}.err{color:#f66;min-height:20px}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--l)}.dots i.on{background:var(--a)}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .stk{width:100%;height:auto;aspect-ratio:1}
.in textarea{flex:1;border-radius:22px;padding:11px 14px;resize:none;max-height:120px;height:44px;line-height:1.3;overflow-y:auto}
.swp{position:relative;overflow:hidden}.swp .bgl,.swp .bgr{position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;color:#fff;font-weight:700;visibility:hidden}.swp .bgl{background:#2b7fd0}.swp .bgr{background:#d33;justify-content:flex-end}.swp .it{position:relative;background:var(--bg)}
.sr{display:flex;gap:12px;padding:10px 14px 4px;overflow-x:auto}.sc{flex:none;text-align:center;font-size:12px;width:64px;color:var(--m)}.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--a),#ffffff55,var(--a));display:inline-block}.ring.old{background:#444}.ring .av{border:2px solid var(--bg)}

.cs{display:flex;flex-wrap:wrap;gap:10px}.cs i{width:38px;height:38px;border-radius:50%;display:inline-block;border:3px solid transparent}.cs i.on{border-color:var(--t)}
.wpt{width:64px;height:84px;border-radius:12px;border:1px solid #333;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding:4px;text-align:center;color:#fff}.wpt span{background:#0009;border-radius:6px;padding:1px 4px}
.in{padding:3px 6px;padding-bottom:max(3px,env(safe-area-inset-bottom));gap:2px}.in textarea{height:40px;padding:9px 14px}.in .go{width:40px;height:40px}

.xx{position:absolute;right:6px;top:6px;z-index:2}

.hdr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px 8px;text-align:center}
.cpill{align-self:center;background:var(--l);color:var(--m);border-radius:14px;padding:6px 12px;font-size:13px;margin:6px 0;display:flex;gap:6px;align-items:center}
.emp{margin:auto;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--m)}
.seg{display:flex;background:var(--p);border-radius:14px;padding:4px;gap:4px;margin:12px 12px}.seg button{flex:1;background:none;color:var(--m);padding:9px 4px;font-size:14px}.seg button.on{background:var(--l);color:var(--t)}
.wpc{border-radius:16px;height:104px;position:relative;overflow:hidden;border:2px solid transparent}.wpc.on{border-color:var(--a)}.wpc span{position:absolute;bottom:6px;left:8px;font-size:12px;background:#0008;border-radius:6px;padding:1px 6px;color:#fff}
.wpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.prev{margin:0 12px 12px;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;justify-content:center}
.prev .b1,.prev .b2{max-width:72%;padding:8px 12px;border-radius:14px;font-size:14px}.prev .b1{background:var(--p);align-self:flex-start}.prev .b2{background:var(--o);align-self:flex-end}
#ban{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:40;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:12px;box-shadow:0 10px 30px #0008;display:none;gap:10px;flex-direction:column}
#ban .br{display:flex;gap:8px}#ban .br button{flex:1;padding:9px 6px;font-size:14px}
#mod.mid{align-items:center;justify-content:center;padding:14px}#mod.top{align-items:flex-start;justify-content:center;padding:max(7vh,env(safe-area-inset-top)) 14px 14px}
#mod.mid>div,#mod.top>div{width:min(100%,430px);border-radius:22px;max-height:86%;position:relative;box-shadow:0 12px 44px #000a;padding-top:22px}
.xx{position:absolute;right:6px;top:6px;z-index:2}.mi{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:12px;background:none;color:var(--t);font-weight:500;width:100%;justify-content:flex-start;text-align:left}.mi svg{color:var(--a)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.emo b{font-size:24px;text-align:center;padding:6px 0;border-radius:10px;font-weight:400;display:grid;place-items:center}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{color:var(--m);font-size:13px}.hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.tg{display:flex;align-items:center;gap:10px}
button.r{background:var(--l);color:var(--t)}
</style></head><body><div id="app"></div><div id="mod"><div></div></div>

function srow(ic,label,val,k){return `<div class="srow" data-k="${k}"><div class="ic2">${I(ic)}</div><div style="flex:1;min-width:0">${esc(label)}</div>${val!=null&&val!==''?`<div class="sv">${esc(val)}</div>`:''}${I('chev')}</div>`}
function page(ti,html,wire,back){app.innerHTML=`<div class="bar"><button class="ic" id="pb">${I('back')}</button><b>${esc(ti)}</b></div><div class="list" id="pl">${html}</div>`;$('#pb').onclick=back||(()=>home());wire&&wire($('#pl'))}
function optDlg(ti,opts,cv,cb){dlg(`<b>${esc(ti)}</b>`+opts.map(o=>`<button class="${o[0]==cv?'':'g'}" data-v="${o[0]}">${esc(o[1])}</button>`).join(''),el=>el.onclick=e=>{const v=e.target.closest('[data-v]')?.dataset.v;if(v==null)return;shut();cb(v)},0,'mid')}
function setPriv(k,v){api('profile',{[k]:v}).then(()=>{me[k]=v;settingsPage()}).catch(x=>toast(x.error))}
function banner(h){const B=$('#ban');B.innerHTML=h;B.style.display='flex'}
function bannerOff(){const B=$('#ban');if(B){B.style.display='none';B.innerHTML=''}}
function tone(f,d){if(cfg.snd=='off')return;try{const C=ringCtx||(ringCtx=new(window.AudioContext||window.webkitAudioContext)()),o=C.createOscillator(),g=C.createGain(),n=C.currentTime;o.type=cfg.rt=='bell'?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.22,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(C.destination);o.start(n);o.stop(n+d+0.02)}catch{}}
function ringStop(){clearInterval(ringT);ringT=null}
function ringStart(){ringStop();const P2=cfg.rt=='quiet'?[]:cfg.rt=='pulse'?[[1040,.2],[1040,.2]]:cfg.rt=='bell'?[[1318,.6],[1568,.6]]:[[660,.25],[880,.25],[990,.35]];
 const seq=()=>P2.forEach((p,i)=>setTimeout(()=>tone(p[0],p[1]),i*280));const vib=()=>{try{navigator.vibrate&&navigator.vibrate([400,250,400])}catch{}};seq();vib();ringT=setInterval(()=>{seq();vib()},2200)}
function nativeNote(title,body){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body||'',tag:'sfera'})}catch{}}
function fillCall(d,m){if(cfg.clog=='hide'){d.style.display='none';return}const c=m.call||{},mine=m.uid==me.id,ok=c.st=='done',lab=mine?(ok?t('callout'):t('callout')+' · '+(c.st=='declined'?'✕':'—')):(ok?t('callin'):t('callmiss')),dur=ok&&c.dur?fmtD(c.dur):'';
 d.className='cpill';d.dataset.id=m.id;d.onclick=null;d.innerHTML=`${I(c.v?'cam':'phone')}<span>${lab}${dur?' · '+dur:''}</span>`}
async function enablePush(){try{if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window))return toast(t('nopush'));const pr=await Notification.requestPermission();if(pr!=='granted')return toast(t('nopush'));const reg=await navigator.serviceWorker.register('/sw.js');const k=(await api('pushkey')).key;if(!k)return toast(t('nopush'));
 const old=await reg.pushManager.getSubscription();if(old)await old.unsubscribe();const b64=s=>{const p='='.repeat((4-s.length%4)%4),raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))};
 const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k)});await api('pushsub',{sub:sub.toJSON()});toast(t('pushok'))}catch(x){toast(x.error||t('nopush'))}}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch{}}
function settingsPage(){const m=me||{},PL={all:t('all'),contacts:t('cont'),none:t('seen_n')},onv=v=>v?t('onoff'):t('offl');
 page(t('settings'),`
 <div class="sect">${t('notif')}</div><div class="card">${srow('bell',t('notifon'),onv(cfg.notif!='off'),'nt')}${srow('bell',t('notifs'),onv(cfg.snd!='off'),'sn')}${srow('story',t('rt'),t('rt_'+(cfg.rt||'sfera')),'rt')}${srow('bell',t('perm'),('Notification' in window)?Notification.permission:'—','np')}</div>
 <div class="sect">${t('sec')}</div><div class="card">${srow('lock',t('mp'),{all:t('pall'),contacts:t('pcon'),none:t('pnone')}[m.msgPerm||'all'],'mp')}${srow('phone',t('cp'),{all:t('pall'),ask:t('pask'),none:t('pnone')}[m.callPerm||'all'],'cp')}${srow('eye',t('seenp'),{all:t('seen_t'),recent:t('seen_r'),none:t('seen_n')}[m.seenPerm||'all'],'sp')}${srow('user',t('avp'),m.avPerm==='none'?t('seen_n'):t('all'),'ap')}${srow('story',t('stp'),PL[m.storyPerm||'contacts'],'stp')}${srow('dev',t('sess'),'','ss')}${srow('logout',t('killall'),'','ka')}</div>
 <div class="sect">${t('msgs2')}</div><div class="card">${srow('chat',t('delv'),t(cfg.delv=='hide'?'dhide':'dshow'),'dv')}${srow('phone',t('clog'),t(cfg.clog=='hide'?'chide':'cshow'),'cl')}${srow('stk',t('enter'),onv(sendOnEnter()),'en')}</div>
 <div class="sect">${t('theme')}</div><div class="card">${srow('paint',t('theme'),t(thr()=='light'?'light':'dark')+(cfg.th=='sys'?' · '+t('sys'):''),'th')}${srow('star',t('acc'),'','acc')}${srow('globe',t('lang'),LN[L],'lang')}</div>
 <div class="sect">${t('help')}</div><div class="card">${srow('chat',t('feedb'),'','fb')}${srow('info',t('about'),V,'ab')}${srow('shield',t('privacy'),'','pv')}</div>
 <div class="pad"><button class="g" data-k="lo">${t('out')}</button></div>`,
 el=>el.onclick=async e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;
  try{switch(k){
   case 'nt':setCfg('notif',cfg.notif=='off'?'on':'off');return settingsPage();
   case 'sn':setCfg('snd',cfg.snd=='off'?'on':'off');return settingsPage();
   case 'rt':return optDlg(t('rt'),Object.keys(RTN).map(x=>[x,t('rt_'+x)]),cfg.rt||'sfera',v=>{setCfg('rt',v);settingsPage()});
   case 'np':return enablePush();
   case 'mp':return permDlg('msgPerm');
   case 'cp':return permDlg('callPerm');
   case 'sp':return optDlg(t('seenp'),[['all',t('seen_t')],['recent',t('seen_r')],['none',t('seen_n')]],m.seenPerm||'all',v=>setPriv('seenPerm',v));
   case 'ap':return optDlg(t('avp'),[['all',t('all')],['none',t('seen_n')]],m.avPerm||'all',v=>setPriv('avPerm',v));
   case 'stp':return optDlg(t('stp'),[['all',t('all')],['contacts',t('cont')],['none',t('seen_n')]],m.storyPerm||'contacts',v=>setPriv('storyPerm',v));
   case 'ss':return sessionsPage();
   case 'ka':if(await sure(t('killall')+'?')){await api('endothers');toast('OK')}return settingsPage();
   case 'dv':setCfg('delv',cfg.delv=='hide'?'show':'hide');return settingsPage();
   case 'cl':setCfg('clog',cfg.clog=='hide'?'show':'hide');return settingsPage();
   case 'en':setCfg('enter',sendOnEnter()?'off':'on');return settingsPage();
   case 'th':return themePage();
   case 'acc':return accDlg();
   case 'lang':return pickLang(settingsPage);
   case 'fb':return fbDlg();
   case 'ab':return aboutPage();
   case 'pv':return privDlg();
   case 'lo':return out();
  }}catch(x){toast(x.error||'')}},()=>home('prof'))}
async function sessionsPage(){let r;try{r=await api('sessions')}catch(x){return toast(x.error)}
 page(t('sess'),`<div class="card">${r.list.map(s=>`<div class="srow"><div class="ic2">${I('dev')}</div><div style="flex:1;min-width:0"><div>${esc(s.dev)}${s.cur?' · '+t('sess_cur'):''}</div><div class="mt" style="font-size:13px">${esc(s.ip||'')} ${new Date(s.last||s.ts||Date.now()).toLocaleString()}</div></div>${s.cur?'':`<button class="g" data-kill="${esc(s.id)}">${t('kill')}</button>`}</div>`).join('')}</div>`,
 el=>el.onclick=async e=>{const b=e.target.closest('[data-kill]');if(!b)return;try{await api('endsess',{sid:b.dataset.kill});sessionsPage()}catch(x){toast(x.error)}},()=>settingsPage())}
function themePage(){const WPS=[['std',t('wpstd'),'var(--bg)'],['night',t('wpnight'),'linear-gradient(160deg,#2b3d9e,#0c1238)'],['ocean',t('wpocean'),'linear-gradient(160deg,#18a7d6,#0b4a7a)'],['sun',t('wpsun'),'linear-gradient(160deg,#ff9a5a,#d6246e,#5b1fa0)'],['forest',t('wpforest'),'linear-gradient(160deg,#3fae5a,#124d2a)'],['wine',t('wpwine'),'linear-gradient(160deg,#c42a5b,#4a0f2a)'],['photo',t('wpph'),'linear-gradient(160deg,#4a4a55,#222)']];
 const cw=cfg.wp||'std',th=cfg.th||'dark',bgOf=k=>k=='photo'&&localStorage.wpimg?`url("${localStorage.wpimg}") center/cover`:(WPS.find(x=>x[0]==k)||WPS[0])[2];
 page(t('theme'),`<div class="seg">${['sys','light','dark'].map(k=>`<button class="${th==k?'on':''}" data-th="${k}">${t(k)}</button>`).join('')}</div>
  <div class="prev" style="background:${bgOf(cw)}"><div class="b1">${t('hi1')}</div><div class="b2">${t('hi2')}</div><div class="b1">${t('hi3')}</div></div>
  <div class="sect">${t('wallp')}</div><div class="wpgrid">${WPS.map(w=>`<div class="wpc ${cw==w[0]?'on':''}" data-wp="${w[0]}" style="background:${w[0]=='photo'?bgOf('photo'):w[2]}"><span>${esc(w[1])}</span></div>`).join('')}</div>
  <div class="card"><div class="srow" data-acc="1"><div class="ic2">${I('star')}</div><div style="flex:1">${t('acc')}</div><i style="width:22px;height:22px;border-radius:50%;background:var(--a)"></i></div></div>`,
 el=>el.onclick=e=>{const th2=e.target.closest('[data-th]')?.dataset.th,w=e.target.closest('[data-wp]')?.dataset.wp,ac=e.target.closest('[data-acc]');
  if(th2){setCfg('th',th2);return themePage()}
  if(ac)return accDlg();
  if(w=='photo'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const im=new Image();im.onload=()=>{const q=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.7);try{localStorage.wpimg=data;setCfg('wp','photo')}catch{toast(t('wpbig'))}themePage()};im.src=URL.createObjectURL(f.files[0])};f.click();return}
  if(w){setCfg('wp',w);themePage()}},()=>settingsPage())}
function aboutPage(){page(t('about'),`<div class="hdr"><img class="logo" src="${LOGO}" style="width:96px;height:96px"><div class="h2">SFERA</div><div class="mt">${t('ver1')} ${V}</div><div>${t('slogan')}</div></div><div class="card">${srow('shield',t('privacy'),'','pv')}${srow('chat',t('feedb'),'','fb')}</div>`,
 el=>el.onclick=e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(k=='pv')privDlg();if(k=='fb')fbDlg()},()=>settingsPage())}
function privDlg(){dlg(`<b>${t('privacy')}</b><div style="line-height:1.5;color:var(--m)">${t('privtext')}</div>`,null,0,'mid')}
function profBody(o,own){const ph=o.av?`<img class="big" src="/uploads/a_${o.id}.jpg?${o.av}">`:`<div class="big av" style="font-size:44px">${esc((o.name||'?')[0].toUpperCase())}</div>`;
 const A4=own?[['edit','edit',t('edit3')],['pic','photo',t('phcam')],['story','story',t('stories3')],['set','gear',t('gear')]]:[['phone','call',t('callaud')],['cam','vcall',t('callvid')],['bell','mute',t('sndb')],['dots','more',t('more')]];
 return`<div class="hdr">${ph}<div class="h2" style="margin-top:6px">${esc(o.name)}${bad(o)}</div><div class="mt">${own?'@'+esc(o.username):stat(o)}</div></div>
 <div class="acts4">${A4.map(a=>`<button data-b="${a[1]}">${I(a[0])}<span>${a[2]}</span></button>`).join('')}</div>
 <div class="card">${o.bio?`<div class="srow"><div class="ic2">${I('info')}</div><div style="flex:1;min-width:0">${esc(o.bio)}<div class="mt">${t('bio')}</div></div></div>`:''}<div class="srow"><div class="ic2">${I('user')}</div><div style="flex:1">@${esc(o.username)}<div class="mt">${t('user')}</div></div></div>${o.since?`<div class="srow"><div class="ic2">${I('story')}</div><div style="flex:1">${new Date(o.since).toLocaleDateString()}<div class="mt">${t('sincelbl')}</div></div></div>`:''}</div>
 ${own?`<div class="card">${srow('chat',t('feedb'),'','fb')}${srow('info',t('about'),V,'ab')}</div>`:`<div class="card">${srow('chat',t('media'),'','med')}</div>`}
 <div id="ps" style="padding:0 12px 12px"></div>`}
function profWire(o,own){return async e=>{const b=e.target.closest('[data-b]')?.dataset.b,k=e.target.closest('[data-k]')?.dataset.k;
 try{if(b=='edit')return editProf();if(b=='photo')return pickAvatar();if(b=='story')return addStory();if(b=='gear')return settingsPage();
  if(b=='call'||b=='vcall'){const c2=(await api('dm',{uid:o.id})).chat;return callStart(c2,b=='vcall')}
  if(b=='mute'){const c2=(await api('dm',{uid:o.id})).chat,k2='mute:'+c2.id;if(localStorage[k2])localStorage.removeItem(k2);else localStorage[k2]='1';toast(t(localStorage[k2]?'snd_off':'snd_on'));return}
  if(b=='more')return moreDlg(o);
  if(k=='med'){const c2=(await api('dm',{uid:o.id})).chat;return openChat(c2)}
  if(k=='fb')return fbDlg();if(k=='ab')return aboutPage();
 }catch(x){toast(x.error)}}}

  const h=w(el);return;},0,'mid')}
