:root{--bg:#000;--p:#0a0a0a;--l:#171717;--t:#f2f2f2;--m:#8a8a8a;--a:#2b95e0;--o:#163e63;--br:16px;--sr:50%;--sb:var(--l)}
[data-th=light]{--bg:#fff;--p:#fff;--l:#eef1f4;--t:#101418;--m:#6c7781;--o:#d7efff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;overflow:hidden}
#app{position:fixed;left:0;right:0;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--l);min-height:56px}.bar b{flex:1;min-width:0;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bar small{display:block;color:var(--m);font-weight:400;font-size:13px}
button{background:var(--a);color:var(--ab,#fff);border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600}button.g{background:var(--l);color:var(--t)}button.r{background:#d33}button.ic{background:none;color:var(--m);padding:6px;display:grid;place-items:center;border-radius:50%}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,textarea{background:var(--l);color:var(--t);border:0;border-radius:12px;padding:12px;font:inherit;width:100%;outline:0}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.it{display:flex;gap:12px;padding:9px 14px;align-items:center}.it>div{min-width:0}.it small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tm{margin-left:auto}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#5bc0f8,#2b6cb0);display:grid;place-items:center;flex:none;font-weight:700;color:#fff;object-fit:cover;overflow:hidden}.av svg{width:55%;height:55%}
.vf{width:16px;height:16px;vertical-align:-3px;margin-left:4px}.bd{font-size:11px;border-radius:6px;padding:1px 5px;margin-left:4px;color:#fff;font-weight:600}.s{background:#d22}.mo{background:#6a4}
#msgs{display:flex;flex-direction:column;padding:8px 0;background:var(--bg)}.m{max-width:80%;margin:2px 10px;padding:7px 11px;border-radius:var(--br);background:var(--l);align-self:flex-start;word-break:break-word}.m.me{background:var(--o);align-self:flex-end}
.m.sk{background:none;padding:0}.m small{display:block;color:var(--a);font-size:13px;font-weight:600}.tm{font-size:11px;color:var(--m);text-align:right;margin-top:2px}.mt{color:var(--m);font-size:14px}
.q{border-left:3px solid var(--a);padding:2px 8px;margin-bottom:4px;color:var(--m);font-size:13px}.rx{display:inline-block;background:#0004;border-radius:10px;padding:1px 8px;margin:3px 3px 0 0;font-size:13px}
.cv{width:190px;height:190px;border-radius:50%;object-fit:cover;display:block}audio{width:230px;height:38px}.vc audio{width:150px}
.stk{width:140px;height:140px;border-radius:var(--sr);background:var(--sb);overflow:hidden;color:var(--t)}.stk svg{width:100%;height:100%}
.in{display:flex;gap:4px;padding:6px 8px;background:var(--p);align-items:center;padding-bottom:max(6px,env(safe-area-inset-bottom))}.in input{flex:1;border-radius:22px;padding:11px 14px}
.in .go{background:var(--a);color:var(--ab,#fff);width:42px;height:42px;padding:0;border-radius:50%}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}.pad.c{text-align:center;justify-content:center;min-height:100%;align-items:stretch}.row{display:flex;gap:8px;margin-top:6px}
.tabs{display:flex;background:var(--p);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}.tabs div{flex:1;text-align:center;padding:7px 0;font-size:11px;color:var(--m)}.tabs div.on{color:var(--a)}.tabs svg{display:block;margin:0 auto 2px}
#pn,#rb{padding:7px 14px;background:var(--p);border-bottom:1px solid var(--l);font-size:14px;display:none;color:var(--m)}
#mod{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end}#mod>div{background:var(--p);width:100%;max-height:88%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;border-radius:18px 18px 0 0}
#rec{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.logo{width:96px;height:96px;border-radius:50%;margin:0 auto}.h{font-size:28px;font-weight:800}.h2{font-size:20px;font-weight:700}.err{color:#f66;min-height:20px}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--l)}.dots i.on{background:var(--a)}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .stk{width:100%;height:auto;aspect-ratio:1}
.in textarea{flex:1;border-radius:22px;padding:11px 14px;resize:none;max-height:120px;height:44px;line-height:1.3;overflow-y:auto}
.swp{position:relative;overflow:hidden}.swp .bgl,.swp .bgr{position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;color:#fff;font-weight:700;visibility:hidden}.swp .bgl{background:#2b7fd0}.swp .bgr{background:#d33;justify-content:flex-end}.swp .it{position:relative;background:var(--bg)}
.sr{display:flex;gap:12px;padding:10px 14px 4px;overflow-x:auto}.sc{flex:none;text-align:center;font-size:12px;width:64px;color:var(--m)}.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--a),#ffffff55,var(--a));display:inline-block}.ring.old{background:#444}.ring .av{border:2px solid var(--bg)}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--l);color:var(--t);border:1px solid var(--a);padding:10px 16px;border-radius:14px;z-index:30;display:none;max-width:88%;text-align:center}
#story,#call{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}#mod{z-index:5}
.cs{display:flex;flex-wrap:wrap;gap:10px}.cs i{width:38px;height:38px;border-radius:50%;display:inline-block;border:3px solid transparent}.cs i.on{border-color:var(--t)}
.wpt{width:64px;height:84px;border-radius:12px;border:1px solid #333;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding:4px;text-align:center;color:#fff}.wpt span{background:#0009;border-radius:6px;padding:1px 4px}

function cui(name,vid,incoming){const C=$('#call');C.style.display='flex';C.innerHTML=`<video id="rv" autoplay playsinline style="flex:1;width:100%;object-fit:cover;background:#000"></video><video id="lv" autoplay playsinline muted style="position:absolute;right:12px;top:12px;width:96px;height:128px;object-fit:cover;border-radius:12px;background:#111;${vid?'':'display:none'}"></video>
 <div style="position:absolute;left:0;right:0;top:22%;text-align:center"><div class="h2">${esc(name)}</div><div class="mt" id="cs"></div></div>
 <div class="row" style="position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));justify-content:center">${incoming?`<button id="cy">${t('acpt')}</button>`:`<button class="g" id="cm">${t('mute')}</button>${vid?`<button class="g" id="cc">${t('camt')}</button>`:''}`}<button class="r" id="cx">${incoming?t('decl'):t('endc')}</button></div>`;
 $('#cx').onclick=()=>endCall();$('#cm')&&($('#cm').onclick=()=>lm&&lm.getAudioTracks().forEach(x=>x.enabled=!x.enabled));$('#cc')&&($('#cc').onclick=()=>lm&&lm.getVideoTracks().forEach(x=>x.enabled=!x.enabled))}
async function mkPC(video){lm=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false});pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});lm.getTracks().forEach(x=>pc.addTrack(x,lm));
 if(video&&$('#lv'))$('#lv').srcObject=lm;pc.ontrack=e=>{$('#rv').srcObject=e.streams[0];$('#cs').textContent=''};pc.onicecandidate=e=>e.candidate&&csig('ci',{c:e.candidate});pc.onconnectionstatechange=()=>['failed','closed'].includes(pc.connectionState)&&endCall(1)}
async function callStart(c,video){if(callC)return;callC=c;cui(nm(c),video,0);$('#cs').textContent=t('calling');
 try{await mkPC(video);const o=await pc.createOffer();await pc.setLocalDescription(o);csig('co',{sdp:o,video});ct=setTimeout(()=>{toast(t('noans'));endCall()},45000)}catch{toast('Camera / Mic denied');endCall(1)}}
function callIn(o){if(callC)return ws.send(JSON.stringify({t:'ce',cid:o.cid}));callC={id:o.cid};inc=o;cui(o.fromName,o.video,1);$('#cs').textContent=t('incall');
 $('#cy').onclick=async()=>{cui(o.fromName,o.video,0);try{await mkPC(o.video);await pc.setRemoteDescription(o.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);csig('ca',{sdp:a});cb.forEach(x=>pc.addIceCandidate(x).catch(()=>0));cb=[]}catch{toast('Camera / Mic denied');endCall()}}}
async function callAns(o){if(!pc||!callC||callC.id!=o.cid)return;clearTimeout(ct);await pc.setRemoteDescription(o.sdp);cb.forEach(x=>pc.addIceCandidate(x).catch(()=>0));cb=[]}
function callIce(o){if(!callC||callC.id!=o.cid)return;if(pc&&pc.remoteDescription)pc.addIceCandidate(o.c).catch(()=>0);else cb.push(o.c)}
function callEnd(o){if(callC&&callC.id==o.cid){toast(t('callend'));endCall(1)}}
function endCall(remote){clearTimeout(ct);if(!remote)csig('ce');lm&&lm.getTracks().forEach(x=>x.stop());pc&&pc.close();pc=lm=null;callC=null;inc=null;cb=[];$('#call').style.display='none';$('#call').innerHTML=''}
const WP={n:['Чёрный','Black',null],b:['Тёмно-синий','Navy','linear-gradient(160deg,#0a1a33,#050b16)'],g:['Графит','Graphite','linear-gradient(160deg,#2c2c2c,#0d0d0d)'],gr:['Зелёный','Green','linear-gradient(160deg,#0d2b21,#04100c)'],v:['Фиолетовый','Violet','linear-gradient(160deg,#261644,#0b0618)'],r:['Бордовый','Wine','linear-gradient(160deg,#3a1020,#12060b)'],s:['Закат','Sunset','linear-gradient(160deg,#4a1d3d,#14203f)'],o:['Океан','Ocean','linear-gradient(160deg,#08334a,#04121c)']};
function wpGet(cid){try{return JSON.parse(localStorage['wp:'+cid]||localStorage['wp:g']||'null')}catch{return null}}
function wpApply(cid){const m=$('#msgs');if(!m)return;const w=wpGet(cid);if(!w||w.k=='n'||(w.k!='photo'&&!WP[w.k])){m.style.background='';return}const d=w.d||0,sh=`linear-gradient(rgba(0,0,0,${d}),rgba(0,0,0,${d}))`;m.style.background=w.k=='photo'?`${sh},url(${w.img}) center/cover`:`${sh},${WP[w.k][2]}`}
function wpDlg(sc){const key='wp:'+sc,rd=()=>{try{return JSON.parse(localStorage[key]||'null')}catch{return null}};
 const save=w=>{try{w?localStorage[key]=JSON.stringify(w):localStorage.removeItem(key)}catch{toast(t('wpbig'))}if(cur)wpApply(cur.id)};
 const draw=()=>{const w=rd()||{k:'n',d:0};dlg(`<b>${t(sc=='g'?'wp':'wpc')}</b><div class="cs">${Object.entries(WP).map(([k,v])=>`<div class="wpt" data-k="${k}" style="background:${v[2]||'#000'};${w.k==k?'outline:3px solid var(--a)':''}"><span>${v[L=='ru'?0:1]}</span></div>`).join('')}</div><button id="wph">${t('wpp')}</button><div class="mt">${t('wpd')}</div><div class="row">${[0,.35,.65].map(d=>`<button class="${(w.d||0)==d?'':'g'}" data-d="${d}" style="flex:1">${Math.round(d*100)}%</button>`).join('')}</div>${sc!='g'?`<button class="g" data-r="1">${t('wpr')}</button>`:''}`,
  el=>el.onclick=e=>{const k=e.target.closest('[data-k]')?.dataset.k,d=e.target.dataset.d;
   if(k){save({k,d:w.d||0});draw()}else if(d!=null){save({...w,k:w.k||'n',d:+d});draw()}else if(e.target.dataset.r){save(null);draw()}
   else if(e.target.id=='wph'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const im=new Image();im.onload=()=>{const q=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);save({k:'photo',d:w.d||.35,img:c.toDataURL('image/jpeg',.7)});draw()};im.src=URL.createObjectURL(f.files[0])};f.click()}})};draw()}
fit();boot();
</script></body></html>
