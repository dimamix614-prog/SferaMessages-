:root{--bg:#000;--p:#111;--l:#222;--t:#eee;--m:#888;--a:#2aabee}
*{box-sizing:border-box}html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;overflow:hidden}
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--p);border-bottom:1px solid var(--l)}.bar b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 13px;font:inherit}button.g{background:var(--l)}button.r{background:#c33}
input,select,textarea{background:var(--l);color:var(--t);border:0;border-radius:10px;padding:10px;font:inherit;width:100%}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--p)}.it small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#6cf,#036);display:grid;place-items:center;flex:none;font-weight:700}
.lg{width:28px;height:28px;border-radius:50%}.vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#20a4f3;color:#fff;font:700 10px/1 sans-serif;margin-left:4px;vertical-align:middle}
.bd{font-size:11px;border-radius:6px;padding:1px 5px;margin-left:4px;color:#fff}.s{background:#d22}.mo{background:#6a4}
.m{max-width:82%;margin:4px 10px;padding:8px 11px;border-radius:14px;background:var(--l);align-self:flex-start;word-break:break-word}.m.me{background:#1d4b6e;align-self:flex-end}
#msgs{display:flex;flex-direction:column;padding:6px 0}.m small{display:block;color:var(--a);font-size:12px}.tm{font-size:11px;color:var(--m);text-align:right}
.q{border-left:3px solid var(--a);padding:2px 8px;margin-bottom:4px;color:var(--m);font-size:13px}.rx{display:inline-block;background:#0006;border-radius:10px;padding:1px 7px;margin:3px 3px 0 0;font-size:13px}
.c{width:180px;height:180px;border-radius:50%;object-fit:cover;display:block}audio{width:220px;height:36px}
.in{display:flex;gap:6px;padding:8px;background:var(--p);padding-bottom:max(8px,env(safe-area-inset-bottom))}.in input{flex:1}.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;background:var(--p);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}.tabs div{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--m)}.tabs div.on{color:var(--a)}.tabs span{display:block;font-size:20px}
#pn,#rb{padding:7px 12px;background:var(--p);border-bottom:1px solid var(--l);font-size:14px;display:none;color:var(--m)}
#mod{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end}#mod>div{background:var(--p);width:100%;max-height:85%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;border-radius:16px 16px 0 0}
#rec{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}.logo{display:block;margin:auto;width:90px;border-radius:50%}.h{font-size:30px;font-weight:800;text-align:center}.err{color:#f66}
</style></head><body><div id="app"></div><div id="mod"><div></div></div>

async function api(a,b={}){const r=await fetch('/api',{method:'POST',headers:{'x-token':tok},body:JSON.stringify({a,...b})});const j=await r.json();
 if(r.status===401){tok='';localStorage.t='';auth();throw j}if(!r.ok)throw j;return j}
const bad=o=>o?(o.verified?'<i class="vf">✓</i>':'')+(o.scam?`<span class="bd s">⚠ SCAM</span>`:'')+(o.role=='mod'?'<span class="bd mo">MOD</span>':''):'';
const av=n=>`<div class="av">${esc((n||'?')[0].toUpperCase())}</div>`;
const nm=c=>c.type=='dm'?c.peer.name:c.title,tgt=c=>c.type=='dm'?c.peer:c;
const lst=m=>!m?'':m.deleted?'🚫 '+t('dm'):m.kind=='circle'?'🎥':m.kind=='voice'?'🎤':m.text;
function auth(e=''){let reg=false;const draw=()=>{app.innerHTML=`<div class="pad"><img class="logo" src="${LOGO}"><div class="h">SFERA</div><div style="text-align:center;color:var(--m)">${t('app')}</div>
${reg?`<input id="n" placeholder="${t('name')}">`:''}<input id="u" placeholder="${t('user')}" autocapitalize="off"><input id="p" type="password" placeholder="${t('pass')}">
${reg?`<input id="k" placeholder="${t('key')}">`:''}<div class="err">${e}</div><button id="go">${reg?t('reg'):t('login')}</button><button class="g" id="sw">${reg?t('login'):t('reg')}</button><button class="g" id="lg">${t('lang')}</button></div>`;
 $('#sw').onclick=()=>{reg=!reg;draw()};$('#lg').onclick=()=>{L=L=='ru'?'en':'ru';localStorage.l=L;draw()};
 $('#go').onclick=async()=>{try{const r=await api(reg?'reg':'login',{name:$('#n')?.value,username:$('#u').value,password:$('#p').value,ownerKey:$('#k')?.value});tok=r.token;localStorage.t=tok;boot()}catch(x){e=esc(x.error);draw()}}};draw()}
async function boot(){if(!tok)return auth();let r;
 try{r=await api('me')}catch(x){return}
 me=r.me;rules=r.rules;if(me.banUntil>Date.now())return banned();
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/?t='+tok);
 ws.onmessage=e=>{const o=JSON.parse(e.data);
  if(o.t=='msg'){if(cur&&cur.id==o.msg.cid)addMsg(o.msg);else if(!cur&&T=='chats')home()}
  else if(o.t=='upd'&&cur&&cur.id==o.msg.cid)updMsg(o.msg);else if(o.t=='pin'&&cur&&cur.id==o.cid)setPin(o.msg)};home()}

 const{chats:c}=await api('chats');chats=c;

 const mk=ty=>async()=>{const ti=prompt(t('title'));if(!ti)return;const sl=prompt(t('link'))||'';try{openChat((await api('mk',{type:ty,title:ti,slug:sl})).chat)}catch(x){alert(x.error)}};
 $('#nc').onclick=mk('channel');$('#ng').onclick=mk('group')}
async function openChat(c){cur=c;byId={};rp=null;if(c.type!='dm'&&!c.joined){c=cur=(await api('join',{cid:c.id})).chat}
 const r=await api('msgs',{cid:c.id});
 app.innerHTML=`<div class="bar"><button class="g" id="bk">←</button><b id="hd">${esc(nm(c))}${bad(tgt(c))}</b></div><div id="pn"></div><div class="list" id="msgs"></div><div id="rb"></div>
 ${r.canPost?`<div class="in"><button class="g" id="ci">🎥</button><button class="g" id="vo">🎤</button><input id="tx" placeholder="${t('msg')}" enterkeyhint="send" autocomplete="off"><button id="sd">➤</button></div>`:`<div class="in" style="color:var(--m);justify-content:center">${t('ro')}</div>`}`;
 r.msgs.forEach(m=>byId[m.id]=m);r.msgs.forEach(addMsg);setPin(r.pin);$('#bk').onclick=()=>home();$('#hd').onclick=()=>info(c);
 if(r.canPost){const s=async()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';const rr=rp;setRp(null);
   try{await api('send',{cid:c.id,text:v,reply:rr&&rr.id});if(!localStorage.fb){localStorage.fb=1;setTimeout(fbDlg,1500)}}catch(x){alert(x.error)}};
  $('#sd').onclick=s;$('#tx').onkeydown=e=>e.key=='Enter'&&s();$('#tx').onfocus=()=>{setTimeout(fit,150);setTimeout(fit,400)};$('#ci').onclick=()=>rec(c,true);$('#vo').onclick=()=>rec(c,false)}
 bot()}
function setRp(m){rp=m;const b=$('#rb');if(!b)return;b.style.display=m?'block':'none';b.innerHTML=m?`↩ ${esc(m.from?.name)}: ${esc(lst(m))} <b id="rx" style="float:right">✕</b>`:'';m&&($('#rx').onclick=()=>setRp(null))}
function setPin(m){const p=$('#pn');if(!p)return;cur.pinId=m&&m.id;p.style.display=m?'block':'none';p.innerHTML=m?`${t('pinned')}: ${esc(lst(m))}`:'';p.onclick=()=>{const e=document.querySelector(`[data-id="${m?.id}"]`);e&&e.scrollIntoView({block:'center'})}}
function fill(d,m){const mine=m.uid==me.id;
 const q=m.reply&&byId[m.reply];
 d.className='m'+(mine?' me':'');d.dataset.id=m.id;
 d.innerHTML=(!mine&&cur.type!='dm'?`<small>${esc(m.from?.name)}${bad(m.from)}</small>`:'')+(q?`<div class="q">${esc(q.from?.name)}: ${esc(lst(q))}</div>`:'')+
 (m.deleted?`<i style="color:var(--m)">🚫 ${t('dm')}</i>`:m.kind=='circle'?`<video class="c" src="/uploads/${m.file}" loop playsinline></video>`:m.kind=='voice'?`<audio controls preload="none" src="/uploads/${m.file}"></audio>`:esc(m.text))+
 `<div>${Object.entries(m.re||{}).map(([e,a])=>`<span class="rx">${e} ${a.length}</span>`).join('')}</div><div class="tm">${m.edited?t('ed')+' · ':''}${hm(m.ts)}</div>`;
 d.onclick=e=>{if(e.target.tagName=='AUDIO')return;if(e.target.tagName=='VIDEO'){const v=e.target;return v.paused?v.play():v.pause()}menu(byId[m.id])}}
function addMsg(m){const b=$('#msgs');if(!b)return;byId[m.id]=m;const d=document.createElement('div');fill(d,m);b.appendChild(d);bot()}
function updMsg(m){byId[m.id]=m;const d=document.querySelector(`[data-id="${m.id}"]`);d&&fill(d,m)}
function dlg(html,wire){const M=$('#mod');M.firstElementChild.innerHTML=html+`<button class="g" id="x">${t('close')}</button>`;M.style.display='flex';$('#x').onclick=()=>M.style.display='none';wire&&wire(M.firstElementChild)}
const shut=()=>$('#mod').style.display='none';
function menu(m){if(!m||m.deleted)return;const mine=m.uid==me.id,st=me.role!='user',adm=cur.type=='dm'||cur.admin==me.id||me.role=='owner';
 dlg(`<div style="display:flex;gap:6px;justify-content:space-between">${['👍','❤️','😂','😮','😢','🔥'].map(e=>`<button class="g" data-e="${e}">${e}</button>`).join('')}</div>
 <button class="g" data-a="reply">${t('reply')}</button>${m.kind=='text'?`<button class="g" data-a="copy">${t('copy')}</button><button class="g" data-a="tr">${t('tr')}</button>`:''}
 ${mine&&m.kind=='text'?`<button class="g" data-a="edit">${t('edit')}</button>`:''}${adm?`<button class="g" data-a="pin">${cur.pinId==m.id?t('unpin'):t('pin')}</button>`:''}
 <button class="g" data-a="delme">${t('delme')}</button>${mine||st?`<button class="r" data-a="delall">${t('delall')}</button>`:''}${!mine?`<button class="g" data-a="rep">${t('rep')}</button>`:''}`,
 el=>el.onclick=async ev=>{const a=ev.target.dataset.a,e=ev.target.dataset.e;if(!a&&!e)return;shut();
  try{if(e)await api('react',{mid:m.id,e});
  else if(a=='reply'){setRp(m);$('#tx')&&$('#tx').focus()}
  else if(a=='copy')navigator.clipboard&&navigator.clipboard.writeText(m.text);
  else if(a=='tr'){try{const j=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(m.text.slice(0,450))+'&langpair=autodetect|'+L)).json();dlg(esc(j.responseData.translatedText))}catch{alert(t('tf'))}}
  else if(a=='edit'){const v=prompt(t('edt'),m.text);if(v)await api('edit',{mid:m.id,text:v})}
  else if(a=='pin')await api('pin',{mid:m.id,on:cur.pinId!=m.id});
  else if(a=='delme'){await api('del',{mid:m.id,all:false});const d=document.querySelector(`[data-id="${m.id}"]`);d&&d.remove()}
  else if(a=='delall')await api('del',{mid:m.id,all:true});
  else if(a=='rep'){await api('report',{uid:m.uid,reason:prompt(t('reason'))||''});alert(t('reported'))}}catch(x){alert(x.error)}})}
function rec(c,video){const R=$('#rec'),pv=$('#pv');let st,rc,ch=[],tm,s=0;const ty=video?'video/webm':'audio/webm';
 navigator.mediaDevices.getUserMedia(video?{video:{facingMode:'user',width:360,height:360},audio:true}:{audio:true}).then(m=>{st=m;pv.style.display=video?'block':'none';if(video){pv.srcObject=m;pv.play()}R.style.display='flex';
  rc=new MediaRecorder(m,MediaRecorder.isTypeSupported(ty)?{mimeType:ty}:{});rc.ondataavailable=e=>ch.push(e.data);
  const fin=send=>{clearInterval(tm);R.style.display='none';st.getTracks().forEach(x=>x.stop());rc.onstop=()=>{if(!send)return;const f=new FileReader();f.onload=()=>api('send',{cid:c.id,kind:video?'circle':'voice',data:f.result}).catch(x=>alert(x.error));f.readAsDataURL(new Blob(ch,{type:ty}))};rc.state!='inactive'&&rc.stop()};
  $('#rs').textContent=t('stop');$('#rc').textContent=t('cancel');$('#rs').onclick=()=>fin(true);$('#rc').onclick=()=>fin(false);
  rc.start();tm=setInterval(()=>{$('#rt').textContent='● '+(++s)+'s';if(s>=(video?30:120))fin(true)},1000)}).catch(()=>alert('Camera/Mic denied'))}
function fbDlg(){dlg(`<b>${t('fbq')}</b><textarea id="ft" rows="4" placeholder="${t('fbp')}"></textarea><button id="fs">${t('send')}</button>`,el=>el.querySelector('#fs').onclick=async()=>{const v=$('#ft').value.trim();if(v)await api('feedback',{text:v});shut()})}
async function fbs(){const r=await api('feedbacks');dlg(`<b>${t('fb')}</b>`+(r.list.map(f=>`<div class="m" style="max-width:100%"><small>${esc(f.user?.name)} @${esc(f.user?.username)}</small>${esc(f.text)}</div>`).join('')||t('none')))}
async function users(){const r=await api('users');dlg(`<b>${t('users')}</b><div style="color:var(--m);font-size:12px">${t('reload')}: ${t('rl')}</div>`+r.users.map(u=>`<div class="m" style="max-width:100%"><small>${esc(u.name)}${bad(u)} @${esc(u.username)} ${u.ban?'⛔':''}${u.mute?'🔇':''}</small>${u.role!='owner'?`<button class="g" data-r="${u.id}">${t('reload')}</button> <button class="r" data-w="${u.id}">${t('wipe')}</button>`:'OWNER'}</div>`).join(''),
 el=>el.onclick=async e=>{const r=e.target.dataset.r,w=e.target.dataset.w;try{if(r){await api('reload',{uid:r});alert('OK');users()}else if(w&&confirm(t('sure'))){await api('wipe',{uid:w});users()}}catch(x){alert(x.error)}})}
function info(c){const o=tgt(c),isU=c.type=='dm',st=me.role!='user',ow=me.role=='owner';
 dlg(`<b>${esc(nm(c))}${bad(o)}</b><div style="color:var(--m)">${isU?'@'+esc(o.username):c.slug?'@'+esc(c.slug):''} ${esc(o.bio||'')}</div>
 ${isU?`<button class="g" data-a="report">${t('rep')}</button>`:''}${st?`<button class="g" data-a="scam">${o.scam?t('unscam'):t('scam')}</button>`:''}
 ${ow?`<button class="g" data-a="ver">${o.verified?t('unver'):t('ver')}</button>`:''}${ow&&isU&&o.role!='owner'?`<button class="g" data-a="mod">${o.role=='mod'?t('unmod'):t('mod')}</button>`:''}
 ${st&&isU&&o.role!='owner'?`<b>${t('rules')}</b>${rules.map(r=>`<button class="r" data-r="${r[0]}">${r[0]} ${esc(r[1].split(' / ')[L=='ru'?0:1])} — ${r[2]} ${r[3]>=1e9?'∞':r[3]>=1440?r[3]/1440+'d':r[3]>=60?r[3]/60+'h':r[3]+'m'}</button>`).join('')}<button class="g" data-r="unban">${t('unban')}</button>`:''}`,
 el=>el.onclick=async e=>{const a=e.target.dataset.a,r=e.target.dataset.r;try{
  if(r)await api('mod',{uid:o.id,rule:r});
  else if(a=='report'){await api('report',{uid:o.id,reason:prompt(t('reason'))||''});alert(t('reported'))}
  else if(a=='scam')await api('scam',{kind:isU?'user':'chat',id:o.id,on:!o.scam,reason:o.scam?'':prompt(t('reason'))||'—'});
  else if(a=='ver')await api('verify',{kind:isU?'user':'chat',id:o.id,on:!o.verified});
  else if(a=='mod')await api('setmod',{username:o.username,on:o.role!='mod'});else return;
  shut();home()}catch(x){alert(x.error)}})}
async function appeals(){const r=await api('appeals');dlg(`<b>${t('ap')}</b>`+(r.appeals.map(a=>`<div class="m" style="max-width:100%"><small>${esc(a.user?.name)} @${esc(a.user?.username)} (${esc(a.reason||'')})</small>${esc(a.text)}<br><button data-u="${a.uid}">${t('unban')}</button></div>`).join('')||t('none')),
 el=>el.onclick=async e=>{if(e.target.dataset.u){await api('mod',{uid:e.target.dataset.u,rule:'unban'});shut()}})}
boot();
</script></body></html>
