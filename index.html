<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>SFERA</title><style>
:root{--bg:#000;--p:#111;--l:#222;--t:#eee;--m:#888;--a:#2aabee}
*{box-sizing:border-box}html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;overflow:hidden}
#app{height:var(--vh,100%);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--p);border-bottom:1px solid var(--l)}
.bar b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 13px;font:inherit}button.g{background:var(--l)}button.r{background:#c33}
input,select{background:var(--l);color:var(--t);border:0;border-radius:10px;padding:10px;font:inherit;width:100%}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--p)}.it small{color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#6cf,#036);display:grid;place-items:center;flex:none;font-weight:700}
.bd{font-size:11px;border-radius:6px;padding:1px 5px;margin-left:4px;color:#fff}.v{background:var(--a)}.s{background:#d22}.mo{background:#6a4}
.m{max-width:80%;margin:4px 10px;padding:8px 11px;border-radius:14px;background:var(--l);align-self:flex-start;word-break:break-word}.m.me{background:#1d4b6e;align-self:flex-end}
#msgs{display:flex;flex-direction:column;padding:6px 0}.m small{display:block;color:var(--a);font-size:12px}
.c{width:180px;height:180px;border-radius:50%;object-fit:cover;display:block}
.in{display:flex;gap:6px;padding:8px;background:var(--p);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.in input{flex:1}.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
#mod{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end}#mod>div{background:var(--p);width:100%;max-height:85%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;border-radius:16px 16px 0 0}
#rec{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.logo{font-size:30px;font-weight:800;text-align:center}.err{color:#f66}
</style></head><body><div id="app"></div><div id="mod"><div></div></div>
<div id="rec"><video id="pv" class="c" style="width:240px;height:240px" muted playsinline></video><div id="rt"></div><div><button class="r" id="rs"></button> <button class="g" id="rc"></button></div></div>
<script>
const TR={ru:{app:'Общение без границ',login:'Войти',reg:'Регистрация',name:'Имя',user:'Username',pass:'Пароль',key:'Ключ владельца (только для sfera)',search:'Поиск @username, каналов…',msg:'Сообщение…',back:'←',newch:'Новый канал',newgr:'Новая группа',title:'Название',link:'Ссылка (необязательно)',join:'Подписаться',ro:'Писать могут только админы',report:'Пожаловаться',scam:'Метка SCAM',unscam:'Снять SCAM',ver:'Дать галочку',unver:'Снять галочку',mod:'Назначить модератором',unmod:'Снять модератора',rules:'Наказание по правилам',unban:'Снять бан/мут',reason:'Причина',banned:'Вы заблокированы',appeal:'Написать модератору',send:'Отправить',sent:'Отправлено модераторам',ap:'Обращения',out:'Выйти',lang:'EN',stop:'Стоп и отправить',cancel:'Отмена',reported:'Жалоба отправлена',close:'Закрыть',until:'до'},
en:{app:'Communication without borders',login:'Log in',reg:'Sign up',name:'Name',user:'Username',pass:'Password',key:'Owner key (sfera only)',search:'Search @username, channels…',msg:'Message…',back:'←',newch:'New channel',newgr:'New group',title:'Title',link:'Link (optional)',join:'Subscribe',ro:'Only admins can post',report:'Report',scam:'SCAM mark',unscam:'Remove SCAM',ver:'Give check',unver:'Remove check',mod:'Make moderator',unmod:'Remove moderator',rules:'Punish by rule',unban:'Unban/unmute',reason:'Reason',banned:'You are banned',appeal:'Message moderators',send:'Send',sent:'Sent to moderators',ap:'Appeals',out:'Log out',lang:'RU',stop:'Stop & send',cancel:'Cancel',reported:'Report sent',close:'Close',until:'until'}};
let L=localStorage.l||'ru',tok=localStorage.t||'',me,rules=[],chats=[],cur=null,ws;
const t=k=>TR[L][k],$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(a,b={}){const r=await fetch('/api',{method:'POST',headers:{'x-token':tok},body:JSON.stringify({a,...b})});const j=await r.json();
 if(r.status===401){tok='';localStorage.t='';return auth()}if(!r.ok)throw j;return j}
const bad=(o,mod)=>o?(o.verified?'<span class="bd v">✓</span>':'')+(o.scam?`<span class="bd s" title="${esc(o.scam.reason)}">⚠ SCAM</span>`:'')+(o.role==='mod'?'<span class="bd mo">MOD</span>':o.role==='owner'?'<span class="bd v">OWNER</span>':''):'';
const av=n=>`<div class="av">${esc((n||'?')[0].toUpperCase())}</div>`;
const nm=c=>c.type==='dm'?c.peer.name:c.title, tgt=c=>c.type==='dm'?c.peer:c;
const bot=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight};
function fit(){const v=window.visualViewport;document.documentElement.style.setProperty('--vh',(v?v.height:innerHeight)+'px');scrollTo(0,0);bot()}
if(visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}fit();
function auth(e=''){let reg=false;const draw=()=>{app.innerHTML=`<div class="pad"><div class="logo">◉ SFERA</div><div style="text-align:center;color:var(--m)">${t('app')}</div>
${reg?`<input id="n" placeholder="${t('name')}">`:''}<input id="u" placeholder="${t('user')}" autocapitalize="off"><input id="p" type="password" placeholder="${t('pass')}">
${reg?`<input id="k" placeholder="${t('key')}">`:''}<div class="err">${e}</div><button id="go">${reg?t('reg'):t('login')}</button><button class="g" id="sw">${reg?t('login'):t('reg')}</button><button class="g" id="lg">${t('lang')}</button></div>`;
 $('#sw').onclick=()=>{reg=!reg;draw()};$('#lg').onclick=()=>{L=L=='ru'?'en':'ru';localStorage.l=L;draw()};
 $('#go').onclick=async()=>{try{const r=await api(reg?'reg':'login',{name:$('#n')?.value,username:$('#u').value,password:$('#p').value,ownerKey:$('#k')?.value});tok=r.token;localStorage.t=tok;boot()}catch(x){e=esc(x.error);draw()}}};draw()}
async function boot(){if(!tok)return auth();let r;try{r=await api('me')}catch(x){if(x.error=='banned')r=await fetch('/api',{method:'POST',headers:{'x-token':tok},body:'{"a":"me"}'}).then(r=>r.json());else return}
 me=r.me;rules=r.rules;if(me.banUntil>Date.now())return banned();
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/?t='+tok);
 ws.onmessage=e=>{const o=JSON.parse(e.data);if(o.t=='msg'){if(cur&&cur.id==o.msg.cid)addMsg(o.msg);else if(!cur)home()}};home()}
function banned(){app.innerHTML=`<div class="pad"><div class="logo">⛔ ${t('banned')}</div><div>${me.banUntil>=9e15?'∞':t('until')+' '+new Date(me.banUntil).toLocaleString()}</div><input id="at" placeholder="${t('appeal')}"><button id="as">${t('send')}</button><button class="g" id="lo">${t('out')}</button></div>`;
 $('#as').onclick=async()=>{await api('appeal',{text:$('#at').value});$('#at').value='';alert(t('sent'))};$('#lo').onclick=out}
function out(){localStorage.t='';tok='';ws&&ws.close();auth()}
async function home(){cur=null;const{chats:c}=await api('chats');chats=c;
 app.innerHTML=`<div class="bar"><b>◉ SFERA</b><button class="g" id="lg">${t('lang')}</button>${me.role!='user'?`<button class="g" id="ap">${t('ap')}</button>`:''}<button class="g" id="lo">⎋</button></div>
 <div class="pad" style="padding-bottom:0"><input id="q" placeholder="${t('search')}"></div><div class="list" id="ls"></div>
 <div class="in"><button class="g" id="nc">${t('newch')}</button><button class="g" id="ng">${t('newgr')}</button></div>`;
 const draw=a=>$('#ls').innerHTML=a.map((c,i)=>`<div class="it" data-i="${i}">${av(nm(c))}<div style="min-width:0"><div>${esc(nm(c))}${bad(tgt(c))}</div><small>${c.last?esc(c.last.kind=='circle'?'🎥':c.last.text):''}</small></div></div>`).join('');
 const ls0=e=>{const i=e.target.closest('.it');if(i)openChat(chats[i.dataset.i])};draw(chats);$('#ls').onclick=ls0;
 $('#lg').onclick=()=>{L=L=='ru'?'en':'ru';localStorage.l=L;home()};$('#lo').onclick=out;
 $('#ap')&&($('#ap').onclick=appeals);
 $('#q').oninput=async e=>{const v=e.target.value.trim();if(!v){draw(chats);return $('#ls').onclick=ls0}const r=await api('search',{q:v});
  $('#ls').innerHTML=r.users.map(u=>`<div class="it" data-u="${u.id}">${av(u.name)}<div>${esc(u.name)}${bad(u)}<small>@${esc(u.username)}</small></div></div>`).join('')+r.chats.map(c=>`<div class="it" data-c="${c.id}">${av(c.title)}<div>${esc(c.title)}${bad(c)}<small>@${esc(c.slug)}</small></div></div>`).join('');
  $('#ls').onclick=async e=>{const i=e.target.closest('.it');if(!i)return;if(i.dataset.u)openChat((await api('dm',{uid:i.dataset.u})).chat);else openChat(r.chats.find(c=>c.id==i.dataset.c))}};
 const mk=ty=>async()=>{const ti=prompt(t('title'));if(!ti)return;const sl=prompt(t('link'))||'';try{openChat((await api('mk',{type:ty,title:ti,slug:sl})).chat)}catch(x){alert(x.error)}};
 $('#nc').onclick=mk('channel');$('#ng').onclick=mk('group')}
async function openChat(c){cur=c;if(c.type!='dm'&&!c.joined){c=cur=(await api('join',{cid:c.id})).chat}
 const r=await api('msgs',{cid:c.id});
 app.innerHTML=`<div class="bar"><button class="g" id="bk">${t('back')}</button><b id="hd">${esc(nm(c))}${bad(tgt(c))}</b></div><div class="list" id="msgs"></div>
 ${r.canPost?`<div class="in"><button class="g" id="ci">🎥</button><input id="tx" placeholder="${t('msg')}" enterkeyhint="send"><button id="sd">➤</button></div>`:`<div class="in" style="color:var(--m);justify-content:center">${t('ro')}</div>`}`;
 r.msgs.forEach(addMsg);$('#bk').onclick=home;$('#hd').onclick=()=>info(c);
 if(r.canPost){const s=async()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';try{await api('send',{cid:c.id,text:v})}catch(x){alert(x.error)}};
  $('#sd').onclick=s;$('#tx').onkeydown=e=>e.key=='Enter'&&s();$('#tx').onfocus=()=>setTimeout(()=>{fit();bot()},300);$('#ci').onclick=()=>circle(c)}}
function addMsg(m){const b=$('#msgs');if(!b)return;const d=document.createElement('div');d.className='m'+(m.uid==me.id?' me':'');
 d.innerHTML=(m.uid!=me.id&&cur.type!='dm'?`<small>${esc(m.from?.name)}${bad(m.from)}</small>`:'')+(m.kind=='circle'?`<video class="c" src="/uploads/${m.file}" loop playsinline></video>`:esc(m.text));
 const v=d.querySelector('video');if(v)v.onclick=()=>v.paused?v.play():v.pause();b.appendChild(d);bot()}
function circle(c){let st,rc,ch=[],tm,s=0;const R=$('#rec'),pv=$('#pv');
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:360,height:360},audio:true}).then(m=>{st=m;pv.srcObject=m;pv.play();R.style.display='flex';
  const mt=MediaRecorder.isTypeSupported('video/webm')?'video/webm':'';rc=new MediaRecorder(m,mt?{mimeType:mt,videoBitsPerSecond:600000}:{});rc.ondataavailable=e=>ch.push(e.data);
  const fin=send=>{clearInterval(tm);R.style.display='none';st.getTracks().forEach(x=>x.stop());rc.onstop=async()=>{if(!send)return;const f=new FileReader();f.onload=()=>api('send',{cid:c.id,kind:'circle',data:f.result}).catch(x=>alert(x.error));f.readAsDataURL(new Blob(ch,{type:'video/webm'}))};rc.state!='inactive'&&rc.stop()};
  $('#rs').textContent=t('stop');$('#rc').textContent=t('cancel');$('#rs').onclick=()=>fin(true);$('#rc').onclick=()=>fin(false);
  rc.start();tm=setInterval(()=>{$('#rt').textContent='● '+(++s)+'s';if(s>=30)fin(true)},1000)}).catch(()=>alert('Camera/Mic denied'))}
function dlg(html,wire){const M=$('#mod');M.firstElementChild.innerHTML=html+`<button class="g" id="x">${t('close')}</button>`;M.style.display='flex';$('#x').onclick=()=>M.style.display='none';wire&&wire(M.firstElementChild)}
function info(c){const o=tgt(c),isU=c.type=='dm',st=me.role!='user',ow=me.role=='owner';
 dlg(`<b>${esc(nm(c))}${bad(o)}</b><div style="color:var(--m)">${isU?'@'+esc(o.username):c.slug?'@'+esc(c.slug):''} ${esc(o.bio||'')}</div>
 ${isU?`<button class="g" data-a="report">${t('report')}</button>`:''}
 ${st?`<button class="g" data-a="scam">${o.scam?t('unscam'):t('scam')}</button>`:''}
 ${ow?`<button class="g" data-a="ver">${o.verified?t('unver'):t('ver')}</button>`:''}
 ${ow&&isU&&o.role!='owner'?`<button class="g" data-a="mod">${o.role=='mod'?t('unmod'):t('mod')}</button>`:''}
 ${st&&isU&&o.role!='owner'?`<b>${t('rules')}</b>${rules.map(r=>`<button class="r" data-r="${r[0]}">${r[0]} ${esc(r[1].split(' / ')[L=='ru'?0:1])} — ${r[2]} ${r[3]>=1e9?'∞':r[3]>=1440?r[3]/1440+'d':r[3]>=60?r[3]/60+'h':r[3]+'m'}</button>`).join('')}<button class="g" data-r="unban">${t('unban')}</button>`:''}`,
 el=>el.onclick=async e=>{const a=e.target.dataset.a,r=e.target.dataset.r;try{
  if(r)await api('mod',{uid:o.id,rule:r});
  else if(a=='report'){await api('report',{uid:o.id,reason:prompt(t('reason'))||''});alert(t('reported'))}
  else if(a=='scam'){await api('scam',{kind:isU?'user':'chat',id:o.id,on:!o.scam,reason:o.scam?'':prompt(t('reason'))||'—'});}
  else if(a=='ver')await api('verify',{kind:isU?'user':'chat',id:o.id,on:!o.verified});
  else if(a=='mod')await api('setmod',{username:o.username,on:o.role!='mod'});else return;
  $('#mod').style.display='none';home()}catch(x){alert(x.error)}})}
async function appeals(){const r=await api('appeals');dlg(`<b>${t('ap')}</b>`+r.appeals.map(a=>`<div class="m" style="max-width:100%"><small>${esc(a.user?.name)} @${esc(a.user?.username)} (${esc(a.reason||'')})</small>${esc(a.text)}<br><button data-u="${a.uid}">${t('unban')}</button></div>`).join(''),
 el=>el.onclick=async e=>{if(e.target.dataset.u){await api('mod',{uid:e.target.dataset.u,rule:'unban'});$('#mod').style.display='none'}})}
boot();
</script></body></html>
